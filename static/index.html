<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Pulse</title><link rel="stylesheet" href="/style.css"></head>
<body><main><h1>Pulse</h1><p>Register services and record health checks. Data lasts until the server stops.</p>
